<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>home of cyril</title>
</head>
<body>
    <!-- temporary mockup design -->
    <style>
        body {
            background: #1de0ac;
            overflow: hidden;
            width: 100dvw;
            height: 100dvh;
            display: flex;
            align-items: end;
            justify-content: center;
            margin: 0;
        }

        #temp {
            background: #1de0ac;

            aspect-ratio: 1734/944;
            width: auto;
            height: 90dvh;
        }

        #temp > .menuarea {
            image-rendering: pixelated;

            aspect-ratio: 1734/944;
            width: 100%;
            height: 100%;

            background: url(/img/temp_menu.png);
            background-size: 100%;
            
            display: grid;
            grid-template: 13.559% 13.559% 19.491% 13.559% 4.0254% 13.559% auto /
                           24.625% 47.174% auto;
        }

        #temp .menulink {
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        #link-about {
            grid-row: 1;
            grid-column: 1;
        }

        #link-manual {
            grid-row: 2;
            grid-column: 3;
        }

        #link-projects {
            grid-row: 4;
            grid-column: 1;
        }

        #link-friends {
            grid-row: 6;
            grid-column: 3;
        }
    </style>
    <div id="temp">
        <div class="menuarea">
            <a href="#about" id="link-about" alt="About"><div class="menulink"></div></a>
            <a href="#manual" id="link-manual" alt="Manual"><div class="menulink"></div></a>
            <a href="#projects" id="link-projects" alt="Projects"><div class="menulink"></div></a>
            <a href="#friends" id="link-friends" alt="Friends"><div class="menulink"></div></a>
        </div>
    </div>
</body>
</html>
